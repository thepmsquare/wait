[project]
name = "wait"
version = "1.12.0"
description = "weight tracking app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django~=5.2.0",
    "django-allauth==65.7.0",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.17.1",
    "drf-spectacular>=0.29.0",
    "gunicorn",
    "psycopg2-binary==2.9.10",
    "python-decouple==3.8",
    "PyJWT==2.10.1",
    "cryptography==44.0.3",
    "requests>=2.32.4",
    "whitenoise",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-django",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tracker/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I"]
